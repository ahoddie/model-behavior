# Controlled vocabulary for issue tags and stance targets (data/CONTRACTS.md §3).
# Issue ids match the issue_areas table, so the existing analysis keeps working. Pipelines may only emit ids listed here.
# To add or change an entry, request a contract change from the orchestrator.
version: 1

issues:
  - id: preemption
    label: Federal preemption of state AI laws
    statement: Federal law should override or pause state AI laws.
  - id: frontier_rules
    label: Frontier safety testing and reporting
    statement: The most powerful AI models should face required safety testing, transparency or reporting.
  - id: catastrophic_risk
    label: Catastrophic risk
    statement: Catastrophic risks from AI are serious and need action.
  - id: liability
    label: Liability
    statement: AI developers should be legally liable for harms their systems cause.
  - id: open_models
    label: Open-weight models
    statement: AI model weights should be free to release openly.
  - id: china
    label: Export controls, chips and China
    statement: The US should take tougher measures against China on AI, such as stricter export controls.
  - id: energy
    label: Data centers and energy
    statement: Data centers and power for AI should be built faster, with fewer limits.
  - id: copyright
    label: Copyright and training data
    statement: Rights holders should be protected or paid when their work is used to train AI.
  - id: kids_safety
    label: Kids' online safety
    statement: Children need new protections from AI chatbots and harmful content.
  - id: federal_framework
    label: Federal AI framework bills
    statement: Congress should pass a comprehensive federal AI law.
  - id: agency_rules
    label: Agency rules and executive action
    statement: Federal agencies should issue binding rules on AI.
  - id: jobs
    label: Jobs and workers
    statement: The government should act to protect workers from AI's effects.
  - id: national_security
    label: National security and defense
    statement: The government and military should use more AI.
  - id: civil_rights
    label: Civil rights and bias
    statement: AI needs new protections against bias and discrimination.
  - id: elections
    label: Elections and deepfakes
    statement: Deepfakes and AI in elections need new rules.
  - id: innovation
    label: Innovation and competitiveness
    statement: Lighter AI rules are better for innovation and competition.

# Named targets. `node` is the nodes.id the target links to (bill, rule or race). Stance targets must come from this list
# or be null. `issues` says which issue ids the target is mainly about.
